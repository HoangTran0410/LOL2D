<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="mask-icon" href="favicon/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">

    <title>LOL2D</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/loading-scene.css">
    <link rel="stylesheet" href="styles/menu-scene.css">
    <link rel="stylesheet" href="styles/pregame-scene.css">
    <link rel="stylesheet" href="styles/game-scene.css">
    <link rel="stylesheet" href="styles/hud.css">

    <!-- p5.js and stats.js must load here (not in <body>) so they are parsed and
         execute before the deferred ES module — this exposes all p5 globals
         (loadImage, loadJSON, createVector, background, etc.) to the module below. -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="https://mrdoob.github.io/stats.js/build/stats.min.js"></script>
</head>

<body>
    <script type="module" src="/src/main.ts"></script>

    <div class="center-page-container">
        <div id="game-scene">
            <div id="InGameHUD"></div>
            <div id="stats"></div>
        </div>

        <div id="loading-scene">
            <img id="loading-logo" class="logo" alt="">
            <div class="progress">
                <div class="progress-bar">
                </div>
            </div>
            <div class="loading-text"></div>
            <h2 class="error-text"></h2>
        </div>

        <div id="menu-scene">
            <div class="background"></div>
            <div class="logo">
                <div class="shiny">
                    <img id="menu-logo" alt="logo" class="logo">
                </div>
                <p class="p2d slide-bck-center">2D</p>
            </div>

            <button id="play-btn" class="hextech-btn">Chơi</button>
            <button id="config-btn" class="hextech-btn secondary">Cấu Hình Trận Đấu</button>

            <button id="fullscreen-btn">
                <i class="fas fa-expand"></i>
            </button>
        </div>

        <div id="pregame-scene">
            <div class="pregame-panel">
                <header class="pregame-header">
                    <button id="pregame-back-btn" class="pregame-icon-btn" title="Quay lại">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h1>Cấu Hình Trận Đấu</h1>
                </header>

                <div class="pregame-body">
                    <section class="pregame-section">
                        <h2>Tướng Của Bạn</h2>
                        <div class="champion-grid" id="pregame-champion-grid"></div>
                    </section>

                    <section class="pregame-section">
                        <h2>Phép Bổ Trợ</h2>
                        <div class="summoner-row">
                            <div class="summoner-slot">
                                <span class="summoner-slot-label">D</span>
                                <div class="summoner-options" id="pregame-summoner-d"></div>
                            </div>
                            <div class="summoner-slot">
                                <span class="summoner-slot-label">F</span>
                                <div class="summoner-options" id="pregame-summoner-f"></div>
                            </div>
                        </div>
                    </section>

                    <section class="pregame-section pregame-columns">
                        <div class="pregame-column">
                            <h2>Tướng Địch (AI)</h2>
                            <label class="pregame-field">
                                <span>Số lượng tướng AI: <strong id="pregame-ai-count-value">5</strong></span>
                                <input type="range" id="pregame-ai-count" min="0" max="10" step="1">
                            </label>
                            <label class="pregame-toggle">
                                <input type="checkbox" id="pregame-ai-automove">
                                <span>AI tự di chuyển</span>
                            </label>
                            <label class="pregame-toggle">
                                <input type="checkbox" id="pregame-ai-autoattack">
                                <span>AI tự tấn công</span>
                            </label>
                            <label class="pregame-toggle">
                                <input type="checkbox" id="pregame-ai-autocast">
                                <span>AI tự dùng kỹ năng</span>
                            </label>
                        </div>

                        <div class="pregame-column">
                            <h2>Luật Đấu</h2>
                            <label class="pregame-field">
                                <span>Giảm hồi chiêu: <strong id="pregame-cdr-value">0%</strong></span>
                                <input type="range" id="pregame-cdr" min="0" max="90" step="10">
                            </label>
                            <label class="pregame-toggle">
                                <input type="checkbox" id="pregame-urf">
                                <span>URF (không tốn mana)</span>
                            </label>
                        </div>
                    </section>
                </div>

                <footer class="pregame-actions">
                    <button id="pregame-reset-btn" class="hextech-btn secondary">Mặc Định</button>
                    <button id="pregame-start-btn" class="hextech-btn">Bắt Đầu</button>
                </footer>
            </div>
        </div>
    </div>
</body>

</html>
