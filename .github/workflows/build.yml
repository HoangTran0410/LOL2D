name: Build

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Lifted to the job so the deploy step below can ask whether the token
    # exists: the `secrets` context is not available in an `if:`, but `env` is.
    # Without that guard a fork — or this repo before the secrets are added —
    # would go red on a deploy nobody configured.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:all

      # `npm run verify:all` runs core's own `verify` (which ends in `vite
      # build`, so dist/ is already on disk as the *verified* build) plus
      # every workspace's own checks — `packs/riot`'s and `packs/reference`'s
      # asset/catalogue/typecheck/seam gates. CI runs `verify:all` and never
      # plain `verify`, and that is not a temporary arrangement: `verify` is
      # scoped to core *by intent* (content-pack-extraction batch 5 task 6),
      # and a pack's own gates are the pack's own to run.
      #
      # What this comment used to say — that `verify` "has to keep passing
      # once packs/riot/ leaves this tree" — is a goal, not a property, and
      # fix round 4 corrected it rather than leaving CI documented by an
      # aspiration. Today `verify` still compiles and tests the pack:
      # `src/content/install.ts` statically imports `packs/riot/pack`,
      # `packs/reference/pack` and `packs/riot/generated/assetManifest`, so
      # `typecheck` and `build` both follow it in, and 109 test files under
      # `tests/` import from `packs/`. Measured rather than assumed — with
      # `packs/` moved aside, `vue-tsc` stops in `src/content/install.ts`:
      # `error TS2307: Cannot find module '../../packs/riot/pack'`. Making
      # that import the dynamic one `install.ts`'s own header describes as
      # "Stage 2" is what closes it, and that is a later task's job.
      #
      # Nothing ships that did not pass typecheck and the whole suite first —
      # that is the point of deploying from here rather than connecting the
      # repo to Cloudflare's own git builds, which would publish a red main.
      - name: Deploy to Cloudflare Pages
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy dist --project-name=lol2d --branch=main

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
