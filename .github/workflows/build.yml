name: Build

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Lifted to the job so the deploy step below can ask whether the token
    # exists: the `secrets` context is not available in an `if:`, but `env` is.
    # Without that guard a fork — or this repo before the secrets are added —
    # would go red on a deploy nobody configured.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify

      # `npm run verify` ends in `vite build`, so dist/ is already on disk and
      # is the *verified* build — nothing ships that did not pass typecheck and
      # the whole suite first. That is the point of deploying from here rather
      # than connecting the repo to Cloudflare's own git builds, which would
      # publish a red main.
      - name: Deploy to Cloudflare Pages
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy dist --project-name=lol2d --branch=main

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
