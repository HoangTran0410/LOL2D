name: Build

# This repository is frozen: the game moved to https://github.com/moba2d-game/core
# (engine) + https://github.com/moba2d-packs/lol (this game's content) and now
# lives at https://moba2d.pages.dev. This workflow only ships the redirect page
# in redirect/ to both of the old hosts, so every old link keeps working.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Lifted to the job so the deploy step below can ask whether the token
    # exists: the `secrets` context is not available in an `if:`, but `env` is.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy redirect to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy redirect --project-name=lol2d --branch=main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
